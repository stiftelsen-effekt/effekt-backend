# Nightly clean-up of preview environments (docs/preview-environments.md): deletes previews of
# closed PRs, reminds after PREVIEW_IDLE_WARN_DAYS (14) without a push and deletes after
# PREVIEW_IDLE_DELETE_DAYS (21). Runs from the default branch only (scheduled workflows always do;
# the workload identity provider only trusts this file there).
name: Preview janitor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be done
        type: boolean
        default: true

permissions: {}

concurrency:
  group: preview-janitor
  cancel-in-progress: false

jobs:
  janitor:
    if: vars.PREVIEW_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW_IDLE_WARN_DAYS: ${{ vars.PREVIEW_IDLE_WARN_DAYS || '14' }}
      PREVIEW_IDLE_DELETE_DAYS: ${{ vars.PREVIEW_IDLE_DELETE_DAYS || '21' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_CI_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            scripts/preview/janitor.sh --dry-run
          else
            scripts/preview/janitor.sh
          fi
