# Per-PR preview environments (docs/preview-environments.md).
#
# pull_request_target: this file and scripts/preview/* always come from the default branch, so a
# PR cannot change what runs with cloud credentials (the workload identity provider only trusts
# this workflow on the default branch). The PR's code is only built into the image (docker build
# runs before any credentials exist) and runs on Cloud Run as the runtime service account, which
# can reach nothing but the effekt-previews Cloud SQL instance.
# Fork PRs never deploy. Infrastructure: scripts/preview/provision.sh.
# Only PRs with the `preview` label get a preview; removing the label tears it down.
name: Preview

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- needed for credentials; PR code is only built, see the header
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

permissions: {}

# One preview per PR: a push cancels the PR's run in flight and deploys the new commit. Other
# labels get a group of their own, so labelling a PR doesn't cancel its deploy.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'preview' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_MAX: ${{ vars.PREVIEW_MAX || '5' }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the trusted scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      # The PR head is checked out on purpose (it's what the preview shows). Its code never runs
      # with credentials: fork PRs are excluded above, the checkout keeps no token, the build step
      # below gets no GH_TOKEN, and GCP auth happens only after the build.
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # Branches from before the preview setup (no Dockerfile.preview) get no preview and no
      # comment; only a file check runs on the PR's checkout here. Branches from before the
      # apps/ restructure still have it at the repository root; both build from the root.
      - name: Check that the branch supports previews
        id: support
        run: |
          if [[ -f pr/apps/api/Dockerfile.preview ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "dockerfile=pr/apps/api/Dockerfile.preview" >> "$GITHUB_OUTPUT"
          elif [[ -f pr/Dockerfile.preview ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "dockerfile=pr/Dockerfile.preview" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Dockerfile.preview on this branch; skipping the preview."
          fi

      - name: Comment "building"
        if: steps.support.outputs.enabled == 'true'
        run: trusted/scripts/preview/pr-comment.sh "$PR" building --sha "$SHA"

      # Before authenticating: the PR's Dockerfile and code run here, with no credentials around
      # (the checkouts don't keep tokens, and the GCP credentials don't exist yet).
      - name: Build the preview image
        if: steps.support.outputs.enabled == 'true'
        env:
          # The job-level token isn't needed to build; keep it out of this step's environment
          GH_TOKEN: ""
          REGION: ${{ vars.PREVIEW_GCP_REGION }}
          PROJECT: ${{ vars.PREVIEW_GCP_PROJECT }}
          DOCKERFILE: ${{ steps.support.outputs.dockerfile }}
        # IMAGE is built from repository variables and the PR number and head SHA only
        run: | # zizmor: ignore[github-env]
          image="${REGION}-docker.pkg.dev/${PROJECT}/effekt-previews/backend:pr-${PR}-${SHA}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          DOCKER_BUILDKIT=1 docker build -f "$DOCKERFILE" -t "$image" pr

      - name: Authenticate to Google Cloud
        if: steps.support.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_CI_SA }}

      - name: Set up gcloud
        if: steps.support.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check the preview limit
        if: steps.support.outputs.enabled == 'true'
        id: capacity
        run: trusted/scripts/preview/capacity.sh "$PR" "$RUNNER_TEMP/capacity.md"

      - name: Comment "not created" (limit reached)
        if: steps.support.outputs.enabled == 'true' && steps.capacity.outputs.allowed != 'true'
        run: >-
          trusted/scripts/preview/pr-comment.sh "$PR" capped --sha "$SHA"
          --note-file "$RUNNER_TEMP/capacity.md"

      - name: Push the image
        if: steps.support.outputs.enabled == 'true' && steps.capacity.outputs.allowed == 'true'
        env:
          REGION: ${{ vars.PREVIEW_GCP_REGION }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      - name: Migrate, seed and deploy
        id: deploy
        if: steps.support.outputs.enabled == 'true' && steps.capacity.outputs.allowed == 'true'
        run: trusted/scripts/preview/deploy.sh "$PR" "$IMAGE" "$SHA"

      - name: Comment "ready"
        if: steps.support.outputs.enabled == 'true' && steps.capacity.outputs.allowed == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SEEDED_AT: ${{ steps.deploy.outputs.seeded_at }}
        run: >-
          trusted/scripts/preview/pr-comment.sh "$PR" ready --sha "$SHA"
          --url "$URL" --seeded-at "$SEEDED_AT"

      - name: Comment "failed"
        if: failure()
        run: trusted/scripts/preview/pr-comment.sh "$PR" failed --sha "$SHA"

  teardown:
    if: >-
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the trusted scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_CI_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Tear down
        run: trusted/scripts/preview/teardown.sh "$PR"

      - name: Comment "torn down"
        env:
          ACTION: ${{ github.event.action }}
        run: |
          if [[ "$ACTION" == "closed" ]]; then
            echo "Deleted because the PR was closed." > "$RUNNER_TEMP/note.md"
          else
            echo "Deleted because the \`preview\` label was removed." > "$RUNNER_TEMP/note.md"
          fi
          trusted/scripts/preview/pr-comment.sh "$PR" torn-down --sha "$SHA" --note-file "$RUNNER_TEMP/note.md"
