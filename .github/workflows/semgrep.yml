on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    # random HH:MM to avoid a load spike on GitHub Actions at 00:00
    - cron: 52 20 * * *
name: Semgrep
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      # Deliberately unpinned so scans use the current Semgrep engine and rules
      image: semgrep/semgrep # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Repository rules in .semgrep/. These run without the Semgrep app.
      - name: Test custom rules
        run: semgrep test .semgrep/

      # Every finding blocks. A false positive gets a `nosemgrep: <rule-id> -- <reason>`
      # comment on the line (or the line before), never a blanket ignore.
      - name: Custom rules
        if: always()
        run: semgrep scan --metrics=off --config .semgrep/ --exclude .semgrep --error .

      # pnpm 11+ writes pnpm-lock.yaml as two YAML documents: the pnpm version it installs
      # (packageManagerDependencies), then the workspace's lockfile. Semgrep Supply Chain only
      # reads single-document lockfiles ("expected a single document in the stream") and then
      # sees no dependencies at all, so it gets the last document alone: in this checkout, and
      # through a smudge filter in the baseline checkout a pull request's scan compares with.
      # The changed file leaves the checkout dirty, which makes `semgrep ci` check the baseline
      # out in a separate git worktree (where the filter applies) instead of `git reset --hard`.
      - name: Give Semgrep a single-document pnpm-lock.yaml
        if: always() && env.SEMGREP_APP_TOKEN != ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          script="$RUNNER_TEMP/last-yaml-document"
          cat > "$script" <<'SCRIPT'
          #!/bin/sh
          # Copies stdin's last YAML document (everything after the last `---` line) to stdout
          file=$(mktemp)
          cat > "$file"
          last=$(grep -n '^---$' "$file" | tail -n 1 | cut -d: -f1)
          tail -n "+$((${last:-0} + 1))" "$file"
          rm -f "$file"
          SCRIPT
          chmod +x "$script"
          git config filter.last-yaml-document.smudge "$script"
          git config filter.last-yaml-document.clean cat
          echo "pnpm-lock.yaml filter=last-yaml-document" >> "$(git rev-parse --git-common-dir)/info/attributes"
          "$script" < pnpm-lock.yaml > "$RUNNER_TEMP/pnpm-lock.yaml"
          mv "$RUNNER_TEMP/pnpm-lock.yaml" pnpm-lock.yaml
          head -n 1 pnpm-lock.yaml

      # Rules managed in the Semgrep app (blocking findings fail the job). Skipped when the
      # token is not available (e.g. pull requests from forks).
      - name: Semgrep app rules
        if: always() && env.SEMGREP_APP_TOKEN != ''
        run: semgrep ci
