name: web-ci
# e2e tests against Vercel deployments of apps/web. Vercel reports a deployment_status for each
# deployment; the project name in the URL picks the test suite. Deployments of other projects,
# and other deployment statuses in this repository, run nothing.
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
on: [deployment_status]
permissions: {}
jobs:
  e2e-no:
    # only runs this job on successful deploy to main-site
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.target_url, 'main-site')
    # Production runs share the site and the Min Side test account: one at a time, and only the
    # newest waiting one runs (GitHub drops older pending runs in the group). Previews run freely.
    concurrency:
      group: web-e2e-no-${{ startsWith(github.event.deployment_status.environment, 'Production') && 'production' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: $/.github/workflows/web-e2e.yml
    with:
      group: "GiEffektivt e2e tests"
      # The production Min Side Auth0 app only allows exact callbacks, so production
      # deployments are tested on the custom domain instead of their *.vercel.app URL
      base-url: ${{ startsWith(github.event.deployment_status.environment, 'Production') && 'https://gieffektivt.no' || github.event.deployment_status.target_url }}
      config-file: "cypress-no.config.ts"
    secrets:
      CYPRESS_AUTH_DOMAIN: ${{ secrets.CYPRESS_AUTH_DOMAIN }}
      CYPRESS_AUTH_USERNAME: ${{ secrets.CYPRESS_AUTH_USERNAME }}
      CYPRESS_AUTH_PASSWORD: ${{ secrets.CYPRESS_AUTH_PASSWORD }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  e2e-dk:
    # only runs this job on successful deploy to giv-effektivt
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.target_url, 'giv-effektivt')
    # Production runs share the site and the Min Side test account: one at a time, and only the
    # newest waiting one runs (GitHub drops older pending runs in the group). Previews run freely.
    concurrency:
      group: web-e2e-dk-${{ startsWith(github.event.deployment_status.environment, 'Production') && 'production' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: $/.github/workflows/web-e2e.yml
    with:
      group: "GivEffektivt e2e tests"
      base-url: ${{ github.event.deployment_status.target_url }}
      config-file: "cypress-dk.config.ts"
    secrets:
      CYPRESS_AUTH_DOMAIN: ${{ secrets.CYPRESS_AUTH_DOMAIN }}
      CYPRESS_AUTH_USERNAME: ${{ secrets.CYPRESS_AUTH_USERNAME }}
      CYPRESS_AUTH_PASSWORD: ${{ secrets.CYPRESS_AUTH_PASSWORD }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
