name: web-e2e-fullstack
# Full-stack Cypress tests for apps/web: the website built against a local API, MySQL with seed
# data and a local OIDC issuer (compose.dev.yml + compose.e2e.yml). Needs no secrets; content is
# read from the public production Sanity dataset. The Vercel-deployment e2e (web-ci.yml) is
# separate and unchanged. See docs/e2e.md.
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.dev.yml"
      - "compose.e2e.yml"
      - "compose.e2e-ci.yml"
      - ".env.docker"
      - "scripts/e2e-fullstack.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-e2e-fullstack.yml"
  # Also on main: GitHub Actions caches made on main are the ones every PR can restore (the
  # Next.js build cache, the Cypress binary).
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.dev.yml"
      - "compose.e2e.yml"
      - "compose.e2e-ci.yml"
      - ".env.docker"
      - "scripts/e2e-fullstack.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-e2e-fullstack.yml"
concurrency:
  group: web-e2e-fullstack-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    name: Full-stack e2e (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The stack's images (MySQL, the mock OIDC issuer, nginx, Node) download, and the services
      # that need nothing from the install (db, auth, oidc) start, while the next steps set up
      # Node and install. The e2e step waits for this to finish before its own `compose up`.
      - name: Start the database and OIDC issuer in the background
        run: |
          (
            compose() { docker compose -f compose.dev.yml -f compose.e2e.yml -f compose.e2e-ci.yml "$@"; }
            compose pull --quiet && compose up -d db auth oidc
            echo "$?" >"$RUNNER_TEMP/e2e-early-stack.done"
          ) >"$RUNNER_TEMP/e2e-early-stack.log" 2>&1 &
      # The pnpm version comes from packageManager in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore the Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      # Next.js's build cache: an older one only means less is reused.
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: web-next-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            web-next-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
            web-next-e2e-
      # The website (and Cypress), plus the API package: for the tRPC type build, for mysql2,
      # which the Cypress resetE2EData task uses to rewrite the seed data
      # (apps/api/prisma/e2e/seed.mjs), and as the backend's install, mounted into the stack's
      # migrate, seed-e2e and api containers (compose.e2e-ci.yml).
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --filter main-site --filter stiftelsen-effekt-backend
          pnpm --filter main-site exec cypress cache prune
      # Brings the stack up, builds and serves the web app, runs Cypress and tears down.
      - name: Run full-stack e2e
        run: pnpm e2e:fullstack
        env:
          E2E_BACKEND_FROM_HOST: "1"
          E2E_WAIT_FOR: ${{ runner.temp }}/e2e-early-stack.done
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-fullstack-${{ github.run_id }}
          path: |
            apps/web/cypress/screenshots
            apps/web/cypress/videos
            apps/web/cypress/logs
          if-no-files-found: ignore
          retention-days: 7
