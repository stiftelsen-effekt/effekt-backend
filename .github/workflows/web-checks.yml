name: web-checks
# Lint, typecheck and unit tests for apps/web (the website, formerly the main-site repository).
permissions:
  contents: read
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-checks.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-checks.yml"
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: apps/web
jobs:
  checks:
    name: Lint, typecheck and test (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Only the web package's dependencies (not the backend's or the admin's).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter main-site
        env:
          # Cypress runs in web-e2e.yml; this job doesn't need its binary.
          CYPRESS_INSTALL_BINARY: "0"
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
