steps:
  - name: "node:24.22.1"
    entrypoint: bash
    id: install
    # The API (apps/api) and the workspace root (Prettier, Oxlint): admin and apps/web have their own
    # checks.
    args:
      [
        "-c",
        "corepack enable && pnpm install --frozen-lockfile --filter effekt-platform --filter stiftelsen-effekt-backend",
      ]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm --filter stiftelsen-effekt-backend test"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm --filter stiftelsen-effekt-backend typecheck"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run format:check"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    # Oxlint on the whole repository (about a second)
    args: ["-c", "corepack enable && pnpm run lint"]

options:
  logging: CLOUD_LOGGING_ONLY
