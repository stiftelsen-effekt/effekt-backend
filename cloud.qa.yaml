steps:
  - name: "node:24.22.1"
    entrypoint: bash
    id: install
    # The API (apps/api) and the workspace root (Prettier, Oxlint): admin and apps/web have their own
    # checks.
    args:
      [
        "-c",
        "corepack enable && pnpm install --frozen-lockfile --filter effekt-platform --filter stiftelsen-effekt-backend",
      ]
  # With every spec file starting at once on 32 vCPUs, a heavy beforeAll (the dev data specs
  # generate five years of data) can exceed Vitest's 5s hook timeout
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args:
      ["-c", "corepack enable && pnpm --filter stiftelsen-effekt-backend test --hookTimeout=30000"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm --filter stiftelsen-effekt-backend typecheck"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run format:check"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    # Oxlint on the whole repository (about a second)
    args: ["-c", "corepack enable && pnpm run lint"]

options:
  logging: CLOUD_LOGGING_ONLY
  # Vitest runs one process per spec file, and every step here shares the machine: on the default
  # 2 vCPUs the tests alone took ~400s.
  machineType: E2_HIGHCPU_32
