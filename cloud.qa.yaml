steps:
  - name: "node:22"
    entrypoint: npm
    id: install
    args: ["install"]
  - name: "node:22"
    entrypoint: npm
    waitFor: ["install"]
    args: ["run", "test"]
  - name: "node:22"
    entrypoint: npm
    waitFor: ["install"]
    args: ["run", "typecheck"]
  - name: "node:22"
    entrypoint: npm
    waitFor: ["install"]
    args: ["run", "format:check"]
