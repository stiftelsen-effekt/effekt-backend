steps:
  - name: "node:24.22.1"
    entrypoint: bash
    id: install
    args: ["-c", "corepack enable && pnpm install --frozen-lockfile"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run test"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run typecheck"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run format:check"]

options:
  logging: CLOUD_LOGGING_ONLY
