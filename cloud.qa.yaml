steps:
  - name: "node:24.22.1"
    entrypoint: bash
    id: install
    # Backend only: admin and apps/web have their own checks.
    args:
      ["-c", "corepack enable && pnpm install --frozen-lockfile --filter stiftelsen-effekt-backend"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run test"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run typecheck"]
  - name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args: ["-c", "corepack enable && pnpm run format:check"]

options:
  logging: CLOUD_LOGGING_ONLY
