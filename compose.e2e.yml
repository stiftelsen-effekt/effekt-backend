# Full-stack e2e environment for the website (apps/web): compose.dev.yml plus this override.
# Cypress drives the real web -> API -> DB chain and logs in through a local OIDC issuer, so no
# secrets and nothing external except read-only Sanity content. See docs/e2e.md.
#
#   pnpm e2e:fullstack         up -> build web -> run Cypress -> down (scripts/e2e-fullstack.sh)
#   pnpm e2e:env:up            only the backend stack (db, migrate + e2e seed, auth, oidc, api)
#   pnpm e2e:env:down          stop and delete everything (the database lives in tmpfs)
#
# Separate project name and host ports from `pnpm dev:env:up`, so both can run at once:
#   E2E_API_PORT (5150), E2E_AUTH_PORT (8191), E2E_DB_PORT (3317).
# The web app is built and served on the host (port 3100), see scripts/e2e-fullstack.sh.
#
# Auth: the website uses @auth0/auth0-react (auth0-spa-js), which calls
#   ${domain}/authorize and ${domain}/oauth/token, and requires iss === "${domain}/"
# for an http:// domain. The mock issuer serves /<issuerId>/authorize and /<issuerId>/token and
# derives iss from the request path. So:
# - `oidc` (nginx) maps /authorize, /oauth/token and /.well-known/jwks.json onto the mock's
#   `web` issuer, and is what the browser uses as NEXT_PUBLIC_AUTH_DOMAIN (http://localhost:8191),
# - the `web` issuer pins iss to "http://localhost:8191/" (trailing slash, as auth0-spa-js
#   expects) and sets aud to both the client id (ID token) and the API audience (access token),
# - the API accepts that iss through AUTH_ADDITIONAL_ISSUERS, verified against the oidc JWKS.
# No application code knows about any of this.

name: effekt-e2e

services:
  db:
    ports: !override
      - "${E2E_DB_PORT:-3317}:3306"
    # Throwaway database: in memory, gone on `down`
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql

  migrate:
    environment:
      # Fixed "today" for the generated background data, so runs are reproducible
      SEED_NOW: "2026-06-30"

  # Deterministic e2e donor (apps/api/prisma/e2e/seed.mjs) on top of the generated data
  seed-e2e:
    image: effekt-backend-dev:local # built by the migrate/api services
    pull_policy: never
    env_file: .env.docker
    command: ["node", "prisma/e2e/seed.mjs"]
    volumes:
      - ./apps/api/prisma/e2e:/app/apps/api/prisma/e2e:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  auth:
    ports: !reset []
    environment:
      # Replaces the dev config: only the `web` issuer, used through `oidc` below.
      # Donor login: authorization_code via the login form, the numeric user-id claim is posted
      # as a login claim (apps/web/cypress/support/commands.js -> loginFullstack).
      # Admin tokens (for test setup through the API): client_credentials with scope=admin at
      # http://localhost:8191/oauth/token.
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "web",
              "tokenExpiry": 86400,
              "requestMappings": [
                {
                  "requestParam": "scope",
                  "match": "admin",
                  "claims": {
                    "sub": "e2e-admin",
                    "iss": "http://localhost:${E2E_AUTH_PORT:-8191}/",
                    "aud": "http://localhost:5050",
                    "permissions": [
                      "admin",
                      "read:donations", "write:donations",
                      "read:profile", "write:profile",
                      "read:distributions", "write:distributions",
                      "read:agreements", "write:agreements",
                      "read:vipps_api", "write:vipps_api"
                    ]
                  }
                },
                {
                  "requestParam": "grant_type",
                  "match": "authorization_code",
                  "claims": {
                    "sub": "$${subject}",
                    "iss": "http://localhost:${E2E_AUTH_PORT:-8191}/",
                    "aud": ["effekt-web-e2e", "http://localhost:5050"],
                    "azp": "effekt-web-e2e",
                    "permissions": [
                      "read:donations", "write:donations",
                      "read:profile", "write:profile",
                      "read:distributions", "write:distributions",
                      "read:agreements", "write:agreements"
                    ]
                  }
                }
              ]
            }
          ]
        }

  oidc:
    image: nginx:1.29.3-alpine
    configs:
      - source: oidc-nginx
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "${E2E_AUTH_PORT:-8191}:8080"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/.well-known/jwks.json"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    ports: !override
      - "${E2E_API_PORT:-5150}:5050"
    environment:
      AUTH_BASE_URL: http://oidc:8080/
      AUTH_ADDITIONAL_ISSUERS: http://localhost:${E2E_AUTH_PORT:-8191}/
      FRONTEND_URL: http://localhost:3100
      MIN_SIDE_URL: http://localhost:3100
    # No file watching in e2e
    command: ["pnpm", "exec", "ts-node", "src/server.ts"]
    depends_on:
      seed-e2e:
        condition: service_completed_successfully
      oidc:
        condition: service_healthy

  admin:
    # Not part of the e2e stack
    profiles: ["admin"]

configs:
  oidc-nginx:
    content: |
      server {
        listen 8080;
        # auth0-spa-js endpoints -> the mock's `web` issuer
        location = /authorize {
          rewrite ^ /web/authorize break;
          proxy_pass http://auth:8080;
        }
        location = /oauth/token {
          rewrite ^ /web/token break;
          proxy_pass http://auth:8080;
        }
        # JWKS for the API's additional-issuer check (apps/api/src/custom_modules/authorization/jwtIssuers.ts)
        location = /.well-known/jwks.json {
          rewrite ^ /web/jwks break;
          proxy_pass http://auth:8080;
        }
        location = /.well-known/openid-configuration {
          rewrite ^ /web/.well-known/openid-configuration break;
          proxy_pass http://auth:8080;
        }
        location / {
          return 404;
        }
      }
