# Builds the admin (apps/admin) and publishes it to its bucket behind the effekt-load-balancer.
# Trigger: push to main touching a file in _GUARD_INCLUDE below (the admin, the API source its
# types come from, shared packages, the lockfile, this file).
# Substitutions (set on the trigger): _BUCKET, _API_URL, _AUTH_DOMAIN, _AUTH_CLIENT_ID, _AUTH_AUDIENCE,
# _FEATURE_REGRANTING ("false" hides Regranting), _REGRANTING_BACKFILLED ("false" shows a notice
# on the regranting pages that past rounds aren't imported yet)
steps:
  # Skip the whole deploy when a newer commit has reached main since this build started: its
  # own build publishes instead (scripts/deploy/guard.sh, docs/deploy.md). Every later step runs
  # through scripts/deploy/unless-skipped.sh.
  - id: guard
    name: "gcr.io/cloud-builders/git"
    entrypoint: bash
    env: ["COMMIT_SHA=$COMMIT_SHA", "DEPLOY_GUARD_INCLUDE=$_GUARD_INCLUDE"]
    args: ["scripts/deploy/guard.sh"]

  - id: install
    name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["guard"]
    # The admin and the backend (pnpm build:types); apps/web is not needed here.
    args:
      [
        "scripts/deploy/unless-skipped.sh",
        "bash",
        "-c",
        "corepack enable && pnpm install --frozen-lockfile --filter stiftelsen-effekt-backend --filter effekt-admin-v2",
      ]

  - id: typecheck
    name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args:
      [
        "scripts/deploy/unless-skipped.sh",
        "bash",
        "-c",
        "corepack enable && pnpm --dir apps/admin typecheck",
      ]

  - id: test
    name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["install"]
    args:
      [
        "scripts/deploy/unless-skipped.sh",
        "bash",
        "-c",
        "corepack enable && pnpm --dir apps/admin test",
      ]

  # Builds while the tests run. After typecheck, not alongside it: both write the generated
  # route tree (src/routeTree.gen.ts).
  - id: build
    name: "node:24.22.1"
    entrypoint: bash
    waitFor: ["typecheck"]
    env:
      - "VITE_API_URL=${_API_URL}"
      - "VITE_AUTH_MODE=auth0"
      - "VITE_AUTH_DOMAIN=${_AUTH_DOMAIN}"
      - "VITE_AUTH_CLIENT_ID=${_AUTH_CLIENT_ID}"
      - "VITE_AUTH_AUDIENCE=${_AUTH_AUDIENCE}"
      - "VITE_FEATURE_REGRANTING=${_FEATURE_REGRANTING}"
      - "VITE_REGRANTING_BACKFILLED=${_REGRANTING_BACKFILLED}"
    args:
      [
        "scripts/deploy/unless-skipped.sh",
        "bash",
        "-c",
        "corepack enable && pnpm --dir apps/admin build",
      ]

  # Check again before publishing: a newer merge may have landed during the build
  - id: guard-before-publish
    name: "gcr.io/cloud-builders/git"
    waitFor: ["build", "test"]
    entrypoint: bash
    env: ["COMMIT_SHA=$COMMIT_SHA", "DEPLOY_GUARD_INCLUDE=$_GUARD_INCLUDE"]
    args: ["scripts/deploy/guard.sh"]

  # Hashed assets are immutable; index.html must always be revalidated so a deploy takes effect
  # immediately. Assets are uploaded first so a new index.html never points at missing files.
  # The bucket keeps every past build's assets (thousands), which `gsutil rsync` took about a
  # minute to compare; `gcloud storage rsync --no-clobber` skips existing names (the names are
  # content hashes) and takes seconds. It only works below the bucket root: at the root it also
  # reads the bucket, which the build's service account may not.
  - id: publish-assets
    name: "gcr.io/cloud-builders/gcloud"
    waitFor: ["guard-before-publish"]
    entrypoint: bash
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "gcloud"
      - "storage"
      - "rsync"
      - "--recursive"
      - "--no-clobber"
      - "--cache-control=public, max-age=31536000, immutable"
      - "apps/admin/dist/assets"
      - "gs://${_BUCKET}/assets"

  # The files at the root (index.html), each copied to its own name: an rsync of the root would
  # list every past asset in the bucket first (~30s). `$$` is a literal `$` in Cloud Build.
  # The gcloud image (it includes gsutil), already pulled for publish-assets: pulling the gsutil
  # image took ~20s.
  - id: publish-index
    name: "gcr.io/cloud-builders/gcloud"
    waitFor: ["publish-assets"]
    entrypoint: bash
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "bash"
      - "-c"
      - 'for f in apps/admin/dist/*; do [[ -f "$$f" ]] || continue; gsutil -h "Cache-Control:no-cache" cp "$$f" "gs://${_BUCKET}/$${f##*/}" || exit 1; done'

options:
  logging: CLOUD_LOGGING_ONLY
  # The default machine has 2 vCPUs; install, typecheck, the tests and the build are CPU-bound
  machineType: E2_HIGHCPU_32

substitutions:
  # The AdminDeploy trigger's includedFiles: the guard skips this build only for a newer commit
  # that changes one of them, since only such a commit starts a newer build. Keep in sync with the
  # trigger (docs/deploy.md).
  _GUARD_INCLUDE: "apps/admin/** apps/api/src/** apps/api/prisma/schema.prisma apps/api/package.json apps/api/tsconfig*.json packages/** pnpm-lock.yaml pnpm-workspace.yaml cloudbuild.admin.yaml scripts/deploy/**"
  _FEATURE_REGRANTING: "true"
  _REGRANTING_BACKFILLED: "false"
