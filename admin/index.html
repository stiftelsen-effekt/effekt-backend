<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Admin</title>
    <script>
      // Apply stored preferences before first paint (see src/lib/preferences.ts).
      (function () {
        var p = {};
        try {
          p = JSON.parse(localStorage.getItem("effekt-admin-preferences") || "{}");
        } catch (e) {}
        var t = p.theme || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.dataset.density = p.density === "compact" ? "compact" : "comfortable";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
