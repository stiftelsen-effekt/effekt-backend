packages:
  - admin

# Only prisma needs its install scripts; ssh2 and cpu-features have JS fallbacks
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  browser-tabs-lock: false
  cpu-features: false
  prisma: true
  ssh2: false

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/react-query@5.105.0"
