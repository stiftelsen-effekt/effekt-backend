packages:
  - apps/*
  - apps/web/studio
  - packages/*
  - functions/*

# Versions shared by more than one package, set once here and referenced as "catalog:" (or
# "catalog:native") in the packages' package.json. Bump them here, then run `pnpm install`.
catalog:
  "@auth0/auth0-react": 2.28.2
  "@trpc/client": 11.19.0
  "@trpc/server": 11.19.0
  "@trpc/tanstack-react-query": 11.19.0
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-v8": 5.0.5
  cross-env: 10.1.0
  katex: 0.19.0
  oxlint: 1.90.0
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  react-feather: 2.0.10
  react-hook-form: 7.91.0
  styled-components: 6.6.0
  # The API (ts-node, Vitest's spec transform) and the website (next build, the tRPC type
  # build) use TypeScript's JavaScript API, which TypeScript 7 doesn't have yet. Packages that
  # only run `tsc` use the native compiler from the `native` catalog below.
  typescript: 5.9.3
  vitest: 5.0.5
  zod: 4.6.7

catalogs:
  native:
    typescript: 7.0.2

# Dependency install scripts pnpm may run. Prisma needs its own; cypress (apps/web) downloads its
# binary; esbuild sets up its platform binaries. ssh2 and cpu-features have JS
# fallbacks, @parcel/watcher only builds from source when asked to, and browser-tabs-lock and
# @scarf/scarf only print a banner.
allowBuilds:
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  browser-tabs-lock: false
  cpu-features: false
  cypress: true
  esbuild: true
  prisma: true
  ssh2: false

# From apps/web (formerly main-site) and its studio. Overrides apply to the whole workspace; apps/admin pins
# @types/react 19.3.0, which satisfies ^19.3.0.
overrides:
  "@types/react": ^19.3.0
  "@module-federation/vite>@module-federation/dts-plugin": ^2.9.2
  # 7.29.1 has CVEs fixed in 7.30.1 (Semgrep Supply Chain)
  "@module-federation/dts-plugin>undici": ^7.30.1
  "@vercel/frameworks>js-yaml": ^3.15.2
  "@vercel/frameworks>smol-toml": ^1.9.0
  typeid-js>uuid: ^11.1.1

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/react-query@5.105.0"
